name: sports-prediction-platform

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports}
      POSTGRES_DB: ${POSTGRES_DB:-sports_prediction}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sports}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /mlruns
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.17.0 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri /mlruns --artifacts-destination /mlruns --serve-artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlruns_data:/mlruns
    # --serve-artifacts (proxy artifact reads/writes through the tracking
    # server's HTTP API) instead of --default-artifact-root (which tells
    # clients to resolve /mlruns as a path on their OWN filesystem). The
    # worker/api/beat containers don't share a volume with this container, so
    # the old setting meant every remote client either silently wrote
    # artifacts nowhere useful (as root, pre-hardening) or hit a permission
    # error trying to mkdir a path that doesn't exist in its own container
    # (as appuser, post-hardening) — either way, never actually reaching this
    # container's real artifact store.

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sports}:${POSTGRES_PASSWORD:-sports}@postgres:5432/${POSTGRES_DB:-sports_prediction}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ../apps:/srv/apps
      - ../packages:/srv/packages
      - ../data:/srv/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: celery -A packages.worker.celery_app worker --loglevel=info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sports}:${POSTGRES_PASSWORD:-sports}@postgres:5432/${POSTGRES_DB:-sports_prediction}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../apps:/srv/apps
      - ../packages:/srv/packages
      - ../data:/srv/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: celery -A packages.worker.celery_app beat --loglevel=info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sports}:${POSTGRES_PASSWORD:-sports}@postgres:5432/${POSTGRES_DB:-sports_prediction}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ../apps:/srv/apps
      - ../packages:/srv/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      # Every fetch in apps/web currently happens server-side (Next.js Server
      # Components, no "use client" fetches), so this only needs to resolve
      # from inside the web container's network namespace, where "localhost"
      # means the web container itself, not the api container. Docker
      # Compose's internal DNS resolves the service name "api" to the right
      # container. If a client-side fetch is ever added, it'll need the
      # host-visible http://localhost:8000 instead, since the browser runs
      # outside this Docker network entirely.
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/srv
      - web_node_modules:/srv/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  mlruns_data:
  web_node_modules:
