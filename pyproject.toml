[tool.poetry]
name = "sports-prediction-platform"
version = "0.1.0"
description = "Probabilistic sports prediction and +EV betting intelligence platform (Milestone 1: MLB)"
authors = ["Gavin Dsouza"]
readme = "README.md"
packages = [
    { include = "apps" },
    { include = "packages" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
psycopg = { extras = ["binary"], version = "^3.2.3" }
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.1.1"
httpx = "^0.27.2"
tenacity = "^9.0.0"
pandas = "^2.2.3"
numpy = "^2.1.2"
scipy = "^1.14.1"
statsmodels = "^0.14.4"
scikit-learn = "^1.5.2"
xgboost = "^2.1.1"
mlflow = "^2.17.0"
pybaseball = "^2.2.7"
python-dotenv = "^1.0.1"
structlog = "^24.4.0"
# No upper bound, deliberately: 0.46.0 (^0.46.0's effective ceiling) has a
# real bug under numpy 2.x — `import shap` unconditionally imports its
# `plots` submodule, which does an LCH->RGB color-palette conversion at
# module load time (nothing to do with actual explainer computation) that
# trips numpy 2.x's stricter dtype validation ("TypeError: Converting
# np.inexact or np.floating to a dtype not allowed"), breaking `import shap`
# entirely regardless of numba. Letting the resolver take the newest release
# gives the best chance of a version where that's fixed. If a newer release
# doesn't fix it either, the real workaround is on the code side (lazy import
# + graceful degradation — already in packages/evaluation/explainability.py
# and packages/worker/tasks.py) since this is a bug in shap's own plotting
# code, not anything under our control.
shap = ">=0.46.0"
umap-learn = "^0.5.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-dotenv = "^0.5.2"
ruff = "^0.7.0"
mypy = "^1.13.0"
httpx = "^0.27.2"
factory-boy = "^3.3.1"
pandas-stubs = "^2.2.3.241009"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: flags function calls in argument defaults as a footgun (mutable
# default evaluated once) — correct in general, but FastAPI's dependency
# injection (Depends(...), Query(...)) *requires* this exact pattern and is
# the officially documented way to use it. A known, accepted false positive
# for any FastAPI codebase, not suppressed technical debt.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
env_files = [".env.test"]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/tests/*"]
